name: 01 - Research Trending Topic

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Pipeline job ID (UUID), used as the R2 artifact prefix
        required: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --workspace=services/trend-research
      # TODO(remotion-pipeline-followup): implement services/trend-research/src/index.ts,
      # then call it here with jobId and the R2/Firecrawl secrets below.
      - name: Run trend research
        working-directory: services/trend-research
        run: npm run start -- --jobId "${{ inputs.jobId }}"
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
