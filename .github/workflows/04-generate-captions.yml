name: 04 - Generate Captions

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Pipeline job ID (UUID)
        required: true

jobs:
  captions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/caption-sync/requirements.txt
      # TODO(remotion-pipeline-followup): implement services/caption-sync/src/main.py (faster-whisper)
      - name: Generate word-synced captions
        working-directory: services/caption-sync
        run: python -m src.main --job-id "${{ inputs.jobId }}"
        env:
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'medium' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
