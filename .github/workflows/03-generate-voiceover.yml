name: 03 - Generate Voiceover

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Pipeline job ID (UUID)
        required: true

jobs:
  voiceover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Builds @ai-news/shared then the voiceover service (composite project refs).
      - run: npx tsc -b services/voiceover
      - name: Generate voiceover
        working-directory: services/voiceover
        run: npm run start -- "${{ inputs.jobId }}"
        env:
          # Kokoro-82M (self-hosted neural voice library, Apache-2.0) needs no key
          # and runs cross-platform — ffmpeg is bundled via ffmpeg-static, so no
          # system install is required either. The Windows-only SAPI fallback is
          # unavailable on ubuntu, but "auto" only reaches it if a voice explicitly
          # requests sapi (review-state.json.voiceId); the default/rotation pool is
          # Kokoro-only, so this runner works unmodified for the real pipeline.
          VOICEOVER_ENGINE: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
