name: 07 - Render

# Renders directly on the GitHub-hosted runner — no GCE render VM. That VM
# was the original plan while 4K was the default, but the pipeline now
# defaults to 1080p (see infra/render-server/src/config.ts) and this repo is
# public, so GitHub Actions minutes are free/unlimited on standard runners.
# 4K still works if a job's review-state.json.resolution override requests
# it (see reviewOverrides.ts) — it's just slow on a runner's CPU, which the
# review-dashboard's "New job" screen warns about at selection time.
#
# Proven pattern: identical checkout/build/render steps to
# test-render-in-ci.yml's full-pipeline mode, which produced a real
# 9-minute video end-to-end earlier in this project. The only difference is
# this workflow points at real R2 (via secrets), not the local S3 mock that
# test workflow uses.

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Pipeline job ID (UUID)
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    # The slowest step in the pipeline, especially above 1080p — real headroom.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Builds @ai-news/shared, remotion, and infra/render-server (composite
      # project refs) — render-step.mts imports render-server's runRender()
      # directly, so its dist/ (and its dependencies') must exist first.
      - run: npx tsc -b
      - name: Render
        run: npx tsx .github/scripts/render-step.mts "${{ inputs.jobId }}"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CHANNEL_NAME: NationScope
          # runRender() is called directly here, bypassing render-server's HTTP
          # layer entirely, so this value is never actually checked -- config.ts
          # just requires it to be non-empty at module load (see
          # infra/render-server/src/config.ts and test-render-in-ci.mts, which
          # hits the same requirement).
          RENDER_SERVER_SHARED_SECRET: unused-direct-import-not-http
