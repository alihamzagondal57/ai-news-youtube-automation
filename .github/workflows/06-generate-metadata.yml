name: 06 - Generate Metadata

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Pipeline job ID (UUID)
        required: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Builds @ai-news/shared then the metadata-generator service (composite project refs).
      - run: npx tsc -b services/metadata-generator
      - name: Generate SEO metadata
        working-directory: services/metadata-generator
        run: npm run start -- "${{ inputs.jobId }}"
        env:
          # Reuses script-generator's ENTIRE provider chain, not a metadata-specific
          # one (services/metadata-generator/src/index.ts imports
          # @ai-news/script-generator/providers/registry directly) — same full env
          # set as 02-generate-script.yml, not just Anthropic.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
