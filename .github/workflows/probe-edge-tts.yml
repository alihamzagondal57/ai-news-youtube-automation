name: Probe - Edge TTS reachability

# One-off diagnostic: does the Edge TTS neural endpoint work from a GitHub-hosted
# ubuntu runner (whose egress IP differs from the dev sandbox that gets a 403)?
# Trigger manually from the Actions tab or with `gh workflow run probe-edge-tts.yml`.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Probe Edge TTS (real synthesis)
        run: npx tsx .smoke-test/probe-edge-tts.mts
