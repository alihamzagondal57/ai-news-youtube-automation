name: TEST - Render inside GitHub Actions (no VM)

# Diagnostic workflow, not part of the regular per-step pipeline (see
# 07-trigger-render.yml for the production GCE-VM path). Isolated render-only
# test — same synthetic-clip pattern as .smoke-test/smoke-test-1080p.mts (real
# Remotion + ffmpeg, no LLM/TTS/Whisper/media-API dependency) — to answer one
# question fast: does a standard GitHub-hosted runner (2 vCPU / 7GB RAM,
# SSD-backed) avoid the disk-I/O render bottleneck measured on local HDD
# hardware, well enough to skip a paid render VM for now.
on:
  workflow_dispatch:

jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Builds every workspace package (composite project refs, see root
      # tsconfig.json) — without this, @ai-news/shared's dist/ doesn't exist
      # on a fresh checkout and every import of it fails immediately.
      - run: npx tsc -b
      # Sample voiceover/music WAVs are gitignored (regenerated locally via
      # remotion/sample-job/generate-fixture-audio.mjs) — a fresh checkout has
      # neither, so this test needs them created explicitly.
      - run: npm run fixture --workspace=remotion
      - name: Run isolated render-only test
        run: npx tsx .github/scripts/render-only-test.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-only-output
          path: |
            /tmp/ci-render-test/render.mp4
            /tmp/ci-render-test/timings.json
          retention-days: 3
